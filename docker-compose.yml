# Filer — un seul service, exposé (pas de ports publiés) et rattaché au
# réseau Docker externe partagé du homelab pour Nginx Proxy Manager.

services:
  filer:
    # Limite mémoire : 256m posés à la main sur le Pi le 28/08/2026, jamais
    # versionnés, donc à la merci du prochain déploiement ; versionnée ici.
    # Relevée à 384m le 24/09/2026 : pic mesuré (memory.peak) de 157 Mio, plus
    # de 60 % de 256m ; 384m est le premier palier au-dessus du double du pic.
    mem_limit: 384m
    build: .
    image: filer:latest
    container_name: filer
    restart: unless-stopped
    # Charge ADMIN_EMAILS, SESSION_SECRET, MAX_UPLOAD_MB, APP_URL (cf. .env.example).
    env_file: .env
    # `expose` (et non `ports`) : le port n'est visible que sur le réseau Docker,
    # Nginx Proxy Manager s'en charge pour l'exposition publique.
    expose:
      - "3000"
    volumes:
      # Volume nommé monté sur /data : fichiers uploadés + base SQLite.
      - filer_data:/data
    # Sonde de santé : la porte (`/`) doit répondre 200. Le déploiement attend
    # cet état (`docker compose up --wait`) et échoue s'il ne vient pas.
    # 127.0.0.1 et jamais localhost : dans les conteneurs du Pi, localhost
    # résout d'abord en ::1, où Next n'écoute pas (HOSTNAME=0.0.0.0).
    # L'image node:24-bookworm-slim n'a ni curl ni wget : on passe par le
    # fetch de Node.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Next standalone est prêt en moins d'une seconde sur le Pi (mesuré le
      # 25/09) ; 30 s de marge si le Pi est chargé, sondées toutes les 5 s pour
      # que le déploiement n'attende pas la fin de la marge.
      start_period: 30s
      start_interval: 5s
    networks:
      - npm_net

volumes:
  filer_data:

networks:
  # Réseau externe que Nginx Proxy Manager possède DÉJÀ : Filer y est rattaché
  # dès le `up`, NPM le voit sans aucun `docker network connect` manuel (lequel
  # ne survit pas à une recréation du conteneur NPM — cf. l'incident SSL
  # gotyeah-stack). Ne JAMAIS laisser le projet créer un `filer_default` isolé.
  # Vérifier le nom du hub : `docker network ls` (npm_net probable, sinon
  # nginx-proxy-manager_default).
  npm_net:
    external: true
