name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1) Vérifie que le projet lint et build (sur PR et sur push).
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # 2) Déploie sur le Pi via SSH (uniquement sur push vers main, après build OK).
  deploy:
    name: Deploy (SSH)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Un seul déploiement à la fois, et jamais interrompu : un déploiement coupé
    # en plein `git pull` ou `docker compose up` laisserait le Pi dans un état
    # bancal. Un push arrivé entre-temps attend son tour.
    concurrency:
      group: deploy-filer
      cancel-in-progress: false
    steps:
      # Sans empreinte, appleboy/ssh-action désactive la vérification de l'hôte
      # en silence : on refuse donc de déployer si le secret est vide.
      - name: Vérifier que l'empreinte du Pi est configurée
        env:
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          if [ -z "$SSH_HOST_FINGERPRINT" ]; then
            echo "::error::Secret SSH_HOST_FINGERPRINT absent : sans lui, le déploiement accepterait n'importe quel hôte."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Empreinte ECDSA du Pi (secret, jamais en clair dans ce dépôt public) :
          # un hôte qui présente une autre clé fait échouer la connexion (24/09).
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          # `up --build` construit l'image avant de recréer le conteneur : l'ancien
          # sert le site pendant tout le build. `--wait` attend ensuite que la
          # sonde du compose passe au vert (plusieurs essais, cf. healthcheck) et
          # fait échouer le job sinon, au lieu d'un succès sur un conteneur mort.
          # En cas d'échec, seul l'état des conteneurs est affiché : les journaux
          # d'un dépôt public sont lisibles par tous, ceux de l'appli n'y vont pas.
          script: |
            set -e
            cd /home/pi/sites/gotyeah-filer
            git pull --ff-only origin main
            docker compose up -d --build --wait --wait-timeout 120 || { docker compose ps -a; exit 1; }
            docker image prune -f
