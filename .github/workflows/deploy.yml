name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1) Vérifie que le projet lint et build (sur PR et sur push).
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # 2) Déploie sur le Pi via SSH (uniquement sur push vers main, après build OK).
  deploy:
    name: Deploy (SSH)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Un seul déploiement à la fois, et jamais interrompu : un déploiement coupé
    # en pleine mise à jour de la copie git ou en plein `docker compose up`
    # laisserait le Pi dans un état bancal. Un push arrivé entre-temps attend son
    # tour (le Pi tient en plus son propre verrou par projet).
    concurrency:
      group: deploy-filer
      cancel-in-progress: false
    steps:
      # Sans empreinte, appleboy/ssh-action désactive la vérification de l'hôte
      # en silence : on refuse donc de déployer si le secret est vide.
      - name: Vérifier que l'empreinte du Pi est configurée
        env:
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          if [ -z "$SSH_HOST_FINGERPRINT" ]; then
            echo "::error::Secret SSH_HOST_FINGERPRINT absent : sans lui, le déploiement accepterait n'importe quel hôte."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # Clé dédiée à Filer depuis le 25/09/2026. Sur le Pi, authorized_keys la force sur
          # « /usr/local/sbin/gotyeah-deploy filer » : git fetch, puis deploy/pi-deploy.sh lu
          # dans origin/main. Elle ne peut que redéployer main (et déposer des résultats
          # Allure, comme toute clé de déploiement du parc).
          key: ${{ secrets.SSH_KEY }}
          # Empreinte ECDSA du Pi (secret, jamais en clair dans ce dépôt public) :
          # un hôte qui présente une autre clé fait échouer la connexion (24/09).
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          # Ignorée par le Pi (commande forcée) : les étapes (avance rapide, build,
          # attente de la sonde, nettoyage des images) vivent dans deploy/pi-deploy.sh.
          script: deploy
