# ─────────────────────────────────────────────────────────────────────────────
# Nginx Proxy Manager — config avancée du Proxy Host « filer.gautierchuinard.com »
#
# ⚠️  Ce fichier N'EST PAS lu automatiquement. C'est le snippet À COLLER dans NPM :
#       Proxy Hosts → (filer…) → Edit → onglet « Advanced »
#       → champ « Custom Nginx Configuration » → coller le bloc en bas → Save.
#     (Déjà appliqué en prod : il est aussi stocké en base, proxy_host.advanced_config
#      du host Filer. NPM régénère la conf de l'hôte à partir de cette valeur — toute
#      retouche faite directement dans le fichier généré est PERDUE au prochain Save.)
#
# CONTEXTE — état réel de CE NPM (homelab Pi, mutualisé ~20 sites) :
#   - /etc/nginx/nginx.conf (contexte http)            : client_max_body_size 2000m  (défaut large)
#   - /data/nginx/custom/server_proxy.conf (chaque server{}) : client_max_body_size 25m
#       => cet include rabaisse TOUS les hosts à 25 Mo (cap voulu pour les pièces
#          jointes de chatpitre). C'est lui qui faisait le « 413 » sur Filer > 25 Mo,
#          PAS le défaut nginx 1m.
#
# POURQUOI un override scopé /api/upload (et pas global) :
#   - On ne touche pas au global : les autres sites (yoga, billetterie, monitor, chatpitre…
#     en prod) restent à 25 Mo.
#   - Un override per-host au niveau server entrerait en DOUBLON avec le 25m de
#     server_proxy.conf (même contexte) → nginx refuse. On descend donc au niveau
#     `location`, plus spécifique que le 25m server-level → il gagne, sans doublon.
#   - On ne relève la limite que sur l'endpoint d'upload (POST /api/upload), seul
#     chemin qui reçoit de gros corps. Le reste de Filer reste à 25 Mo (sans effet,
#     pas d'upload ailleurs).
#
# VALEURS :
#   - client_max_body_size 0   = pas de limite nginx → déléguée à l'app (MAX_UPLOAD_MB).
#   - proxy_request_buffering on = nginx reçoit chaque morceau EN ENTIER (≤ 24 Mio,
#     tampon disque modeste) avant de le passer à l'app. ⚠️ NE PAS remettre `off` :
#     derrière Cloudflare, qui parle HTTP/2 à nginx (`http2 on` sur l'hôte), un corps
#     diffusé au fil de l'eau n'ouvre qu'une petite fenêtre HTTP/2 par aller-retour →
#     upload plafonné à 6,0 Mio/s (mesuré le 22/10/2026), contre 35-44 Mio/s en `on`
#     (app seule ou nginx sans Cloudflare : ~100 Mio/s). `off` ne servait qu'à l'ancien
#     envoi d'un bloc de plusieurs Go, remplacé par l'upload par morceaux.
#   - include proxy.conf       = reprend le proxy_pass/headers standards de NPM (mêmes $server/$port).
#
# RAPPEL Cloudflare (proxy orange, Full Strict) : plafond body 100 Mo (Free/Pro), quoi que
# dise nginx. RÉSOLU côté app par l'upload PAR MORCEAUX (/api/upload/sessions…, couvert
# par le préfixe de cette location) : chaque requête fait ≤ 24 Mio, donc passe aussi le
# 25m de server_proxy.conf SANS cette dérogation (utile pour la preprod). On la garde comme
# marge, et pour le POST /api/upload d'un bloc de l'éditeur d'image.
#
# ─────────────────────────────────────────────────────────────────────────────
# CSP — DÉSORMAIS POSÉE PAR L'APP (next.config.ts, production seulement), PAS ICI.
#
# Jusqu'au 22/10/2026, la CSP vivait dans une ligne `add_header Content-Security-Policy`
# ajoutée À LA MAIN au fichier GÉNÉRÉ par NPM (/data/nginx/proxy_host/26.conf, bloc
# `location /`), absente de sa base : invisible dans l'interface, et effacée par le
# moindre « Save » de l'hôte. Elle est maintenant versionnée dans l'app → rien à mettre
# dans NPM. Ne PAS la remettre ici : deux CSP s'additionnent (le navigateur applique
# l'intersection), et la moindre divergence casserait l'app sans prévenir.
#
# Historique conservé ci-dessous (la leçon vaut pour la CSP de next.config.ts).
#
# ⚠️  INCIDENT DU 27/07/2026, À NE PAS REPRODUIRE
#
# La prod servait cette CSP, posée dans NPM et JAMAIS reportée dans ce fichier :
#     default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'
#
# Sans directive `script-src`, les scripts retombent sur `default-src 'self'`, qui
# n'autorise PAS les scripts inline. Or Next.js App Router hydrate via des <script>
# inline (données Flight). Résultat : React n'hydratait pas, l'application était du
# HTML mort — aucun gestionnaire d'événement, donc AUCUNE mutation possible. Les
# journaux NPM le montraient sans ambiguïté : 33 GET sur la journée, zéro POST,
# zéro PATCH, zéro DELETE. Symptôme rapporté : « impossible de ranger un fichier
# dans un dossier » ; la preprod, qui n'a pas de CSP, fonctionnait parfaitement.
#
# Reproduit ET corrigé en local avant application (hydratation, connexion,
# création de dossier, déplacement de fichier — tous vérifiés sous la CSP ci-dessous).
#
# Ajouts indispensables :
#   - script-src 'unsafe-inline' : hydratation Next.js (un nonce imposerait un
#     proxy.ts dynamique + un refactor des `style={{}}` — cf. next.config.ts).
#   - style-src 'unsafe-inline'  : styles inline React (éditeur d'image, projection).
#   - img-src blob:              : préchargement de projection hors-ligne
#     (`URL.createObjectURL`) — sans ça, « Préparer la projection » casse.
#   - frame-ancestors 'self' (et non 'none') : l'aperçu PDF affiche
#     /api/files/<id>?inline=1 dans une <iframe> de notre propre origine
#     (explorateur, galerie invité, lightbox, écran de projection). Avec 'none',
#     tous les aperçus PDF restaient BLANCS (constaté le 22/10/2026, vérifié dans
#     Chromium : 'self' + X-Frame-Options SAMEORIGIN affichent le PDF, même avec
#     object-src 'none'). Le clickjacking depuis une AUTRE origine reste bloqué.
# ─────────────────────────────────────────────────────────────────────────────

location /api/upload {
    client_max_body_size 0;
    proxy_request_buffering on;
    include conf.d/include/proxy.conf;
}
